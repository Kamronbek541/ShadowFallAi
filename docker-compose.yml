version: '3.8'

services:
  server:
    build:
      context: ./server
    container_name: shadowfall-backend
    restart: unless-stopped
    env_file: ./server/.env
    networks:
      - shadowfall-network

  client:
    build:
      context: .
    container_name: shadowfall-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      # ---> ДОБАВЬ ЭТИ ДВЕ СТРОКИ <---
      - /etc/letsencrypt:/etc/letsencrypt:ro # Пробрасываем всю папку letsencrypt
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro # И эту тоже на всякий случай
    networks:
      - shadowfall-network

  mongo:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - shadowfall-network
  
  # ---> НОВЫЙ СЕРВИС ДЛЯ CERTBOT <---
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./nginx.conf:/etc/nginx/conf.d/default.conf # Certbot тоже нужен доступ к конфигу
      - ./certbot/www:/var/www/certbot
volumes:
  mongo-data:
  certbot-etc:
  certbot-var:

networks:
  shadowfall-network:
    driver: bridge
