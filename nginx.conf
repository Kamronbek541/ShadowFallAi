# --- СЕРВЕР ДЛЯ HTTP (ПОРТ 80) ---
# Перенаправляет все на HTTPS и обрабатывает запросы Certbot

server {
    listen 80;
    server_name aipills.ca www.aipills.ca;
    
    # Обработка запросов для верификации SSL-сертификата
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Все остальные HTTP-запросы будут перманентно перенаправлены на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}


# --- ОСНОВНОЙ СЕРВЕР ДЛЯ HTTPS (ПОРТ 443) ---
# Обслуживает фронтенд и проксирует запросы к API

server {
    listen 443 ssl http2;
    server_name aipills.ca www.aipills.ca;

    # --- Настройки SSL (пути к сертификатам) ---
    ssl_certificate /etc/letsencrypt/live/aipills.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aipills.ca/privkey.pem;
    
    # Подключение рекомендованных настроек безопасности от Let's Encrypt
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Обслуживание фронтенда (React) ---
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Эта строка важна для корректной работы React Router
        try_files $uri $uri/ /index.html;
    }

    # --- Проксирование API-запросов на бэкенд ---
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://server:5252;
        
        # ---> ПОЛНЫЙ НАБОР ЗАГОЛОВКОВ PROXY <---
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Передача реального IP-адреса клиента на бэкенд
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
